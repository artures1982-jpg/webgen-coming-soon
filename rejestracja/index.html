<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Załóż darmowe konto w Webgen i stwórz stronę firmową.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.webgen.pl/rejestracja/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.webgen.pl/rejestracja/">
<meta property="og:site_name" content="Webgen">
<meta property="og:title" content="Rejestracja — Webgen">
<meta property="og:image" content="https://www.webgen.pl/og-image.png">
<title>Rejestracja — webgen.pl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EAF0FB;--s1:#FFFFFF;--s2:#E1EAF9;
  --text:#182335;--muted:#5E6B85;
  --border:rgba(24,35,53,.08);--border2:rgba(24,35,53,.16);
  --green:#4C6FFF;--green2:#3555E0;
  --grad:linear-gradient(135deg,#4C6FFF,#8FA6FF);
  --head:'Bricolage Grotesque',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--head)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px 40px}

.top-bar{position:fixed;top:0;left:0;right:0;height:64px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 48px;z-index:100}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo-mark{width:30px;height:30px;border-radius:7px;
  background:linear-gradient(135deg,#00E5A0,#0066FF,#7B4FFF);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;color:#fff}
.logo-name{font-size:17px;font-weight:700;color:var(--text)}
.logo-name span{background:linear-gradient(135deg,#00E5A0,#0066FF);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.heading{text-align:center;max-width:440px;margin-bottom:24px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--green);
  margin-bottom:16px;opacity:.85}
.heading h1{font-size:28px;font-weight:800;letter-spacing:-.03em;
  line-height:1.15;margin-bottom:10px}
.heading p{font-size:14px;color:var(--muted);line-height:1.6}

#clerk-signup{width:100%;max-width:440px;min-height:400px;display:flex;align-items:center;justify-content:center}
.loading-hint{font-family:var(--mono);font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<nav class="top-bar">
  <a href="/" class="logo">
    <div class="logo-mark">W</div>
    <div class="logo-name">web<span>gen</span></div>
  </a>
</nav>

<div class="heading">
  <div class="eyebrow">// Nowe konto</div>
  <h1>Załóż konto<br>w <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">webgen</span></h1>
  <p>Bezpłatnie, w minutę. Wygenerujesz stronę zaraz po rejestracji.</p>
</div>

<div id="clerk-signup"><div class="loading-hint">Ładowanie…</div></div>

<script src="/shared/clerk.js"></script>
<script>
(function () {
  window.getClerk().then(function (Clerk) {
    if (Clerk.user) {
      window.location.replace('/generator/');
      return;
    }
    var redirect = new URLSearchParams(window.location.search).get('redirect') || '/generator/';
    var _mountEl = document.getElementById('clerk-signup');
    _mountEl.innerHTML = '';
    Clerk.mountSignUp(_mountEl, {
      signInUrl: '/login/',
      forceRedirectUrl: redirect,
      appearance: {
        variables: {
          colorPrimary: '#4C6FFF',
          colorBackground: '#FFFFFF',
          colorText: '#182335',
          colorTextSecondary: '#5E6B85',
          colorInputBackground: '#E1EAF9',
          colorInputText: '#182335',
          colorNeutral: '#182335',
          fontFamily: "'Bricolage Grotesque', sans-serif",
          borderRadius: '10px'
        }
      }
    });
  }).catch(function (err) {
    console.error('Clerk load error:', err);
    document.getElementById('clerk-signup').innerHTML =
      '<div class="loading-hint">Nie udało się załadować rejestracji. Odśwież stronę.</div>';
  });
})();
</script>
</body>
</html>
