<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Płatność zaakceptowana — webgen.pl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080A12;--s1:#10141F;--s2:#161B29;
  --green:#00E5A0;--blue:#2E7CFF;--purple:#7B4FFF;--red:#FF6B6B;
  --text:#F3F6FC;--muted:#8E97AC;
  --border:rgba(255,255,255,.10);
  --brand-grad:linear-gradient(135deg,#00E5A0,#0066FF,#7B4FFF);
  --head:'Bricolage Grotesque',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--head);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.card{position:relative;max-width:460px;width:100%;background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:40px 34px;text-align:center;z-index:1;transition:box-shadow .4s ease}
.card.celebrate{box-shadow:0 0 0 1px rgba(0,229,160,.2),0 30px 90px -20px rgba(0,229,160,.35)}
.logo{font-size:16px;font-weight:800;margin-bottom:24px}
.logo span{color:var(--green)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--green);margin:0 auto 20px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:22px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em}
p{color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:8px}
.url-box{margin:20px 0;padding:14px 16px;background:var(--s2);border:1px solid var(--border);border-radius:10px;word-break:break-all}
.url-box a{color:var(--green);font-weight:700;font-size:15px;text-decoration:none}
.url-box a:hover{text-decoration:underline}
.btn{display:inline-block;margin-top:8px;background:var(--green);color:#05100d;text-decoration:none;font-weight:700;font-size:14px;padding:12px 26px;border-radius:9px}
.btn:hover{filter:brightness(1.08)}
.err{color:var(--red)}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-bottom:10px;opacity:.8}

/* ── CELEBRACJA (tylko showSuccess) ── */
.checkmark-wrap{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;animation:popIn .5s cubic-bezier(.25,1.4,.5,1) both}
.checkmark-wrap svg{width:30px;height:30px;stroke:#05100d;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck .4s ease .3s forwards}
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.confetti-piece{position:absolute;top:-24px;width:8px;height:14px;opacity:.9;animation:confettiFall linear forwards}
@keyframes confettiFall{to{transform:translateY(112vh) rotate(var(--rot));opacity:.4}}
@media(prefers-reduced-motion:reduce){
  .checkmark-wrap,.checkmark-wrap svg,.confetti-piece{animation:none!important}
  .checkmark-wrap svg{stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="card" id="card">
  <div class="logo">web<span>gen</span></div>
  <div id="content">
    <div class="spinner"></div>
    <h1>Aktywuję Twoją stronę…</h1>
    <p>To zajmie kilka sekund.</p>
  </div>
</div>

<script>
(function () {
  var contentEl = document.getElementById('content');
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');

  function showError(msg) {
    contentEl.innerHTML =
      '<div class="eyebrow">Płatność przyjęta</div>' +
      '<h1 class="err">Nie udało się dokończyć aktywacji</h1>' +
      '<p>' + msg + '</p>' +
      '<p>Płatność przeszła poprawnie — napisz do nas, dokończymy aktywację ręcznie.</p>' +
      '<a class="btn" href="mailto:hello@webgen.pl">Napisz na hello@webgen.pl →</a>';
  }

  function spawnConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var host = document.getElementById('confetti');
    if (!host) return;
    var colors = ['#00E5A0', '#2E7CFF', '#7B4FFF'];
    for (var i = 0; i < 60; i++) {
      var p = document.createElement('div');
      p.className = 'confetti-piece';
      var left = Math.random() * 100;
      var delay = Math.random() * 0.4;
      var duration = 2.2 + Math.random() * 1.6;
      var rot = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 360);
      p.style.left = left + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.borderRadius = (i % 3 === 0) ? '50%' : '2px';
      p.style.animationDelay = delay + 's';
      p.style.animationDuration = duration + 's';
      p.style.setProperty('--rot', rot + 'deg');
      host.appendChild(p);
    }
    setTimeout(function () { host.innerHTML = ''; }, 4200);
  }

  function showSuccess(url) {
    var cardEl = document.getElementById('card');
    if (cardEl) cardEl.classList.add('celebrate');
    contentEl.innerHTML =
      '<div class="checkmark-wrap"><svg viewBox="0 0 24 24"><path d="M4 12l5 6L20 6"/></svg></div>' +
      '<div class="eyebrow">Płatność zaakceptowana</div>' +
      '<h1>Strona aktywna 🎉</h1>' +
      '<p>Twoja strona działa pod adresem:</p>' +
      '<div class="url-box"><a href="' + url + '" target="_blank" rel="noopener">' + url + ' →</a></div>' +
      '<a class="btn" href="/dashboard/">Przejdź do panelu klienta →</a>';
    spawnConfetti();
  }

  if (!sessionId) {
    showError('Brak potwierdzenia sesji płatności w adresie strony.');
    return;
  }

  var raw = null;
  try { raw = localStorage.getItem('wg_generated'); } catch (e) {}
  if (!raw) {
    showError('Nie znaleziono wygenerowanej strony w tej przeglądarce (localStorage). Jeśli otworzyłeś ten link na innym urządzeniu niż generator, wróć na to, na którym tworzyłeś stronę.');
    return;
  }

  var payload;
  try { payload = JSON.parse(raw); } catch (e) {
    showError('Zapisane dane wygenerowanej strony są uszkodzone.');
    return;
  }

  fetch('/api/deploy', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      slug: payload.slug,
      html: payload.html,
      plan: payload.plan || 'pro',
      email: payload.email || '',
      contact_email: payload.contact_email || '',
      session_id: sessionId
    })
  })
    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
    .then(function (r) {
      if (!r.ok || !r.data.success) throw new Error((r.data && r.data.error) || 'Nieznany błąd aktywacji');
      // Celowo NIE czyścimy wg_generated — /dashboard/ czyta ten sam klucz, żeby
      // pokazać klientowi jego stronę (brak bazy danych — jedyne źródło prawdy).
      showSuccess(r.data.url);
    })
    .catch(function (err) {
      showError(err.message);
    });
})();
</script>
</body>
</html>
